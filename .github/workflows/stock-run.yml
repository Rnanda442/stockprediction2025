name: Run Stock Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5" # 13:00 UTC weekdays

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      ROBINHOOD_USERNAME: ${{ secrets.ROBINHOOD_USERNAME }}
      ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            robin-stocks \
            pandas \
            numpy \
            requests \
            matplotlib \
            openpyxl \
            python-dotenv \
            tqdm \
            jupyter \
            nbconvert \
            nbclient \
            ipykernel
          python -m ipykernel install --user --name python3

      - name: Restore generated databases
        uses: actions/cache/restore@v4
        with:
          path: |
            *.db
            data/*.db
          key: stock-dbs-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stock-dbs-${{ github.ref_name }}-

      - name: Inspect restored pipeline state
        run: |
          python scripts/inspect_pipeline_state.py

      - name: Run notebook
        run: |
          python scripts/run_notebook_with_progress.py notebook/2025summerstock-Copy6.ipynb --kernel-name python3 --executed-output logs/executed-notebook.ipynb

      - name: Inspect generated pipeline state
        if: always()
        run: |
          python scripts/inspect_pipeline_state.py

      - name: Save generated databases
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            *.db
            data/*.db
          key: stock-dbs-${{ github.ref_name }}-${{ github.run_id }}

      - name: Validate generated outputs
        run: |
          python scripts/validate_pipeline_outputs.py

      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-outputs
          if-no-files-found: warn
          retention-days: 14
          path: |
            analytics/*.csv
            analytics/*.html
            vector_analysis_results.csv
            checkpoint_filtered.csv
            checkpoint_rejected.csv
            logs/executed-notebook.ipynb

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated stock pipeline output update"
          git push
