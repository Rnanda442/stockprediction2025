name: Run Stock Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5" # 13:00 UTC weekdays

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      ROBINHOOD_USERNAME: ${{ secrets.ROBINHOOD_USERNAME }}
      ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robin-stocks jupyter nbconvert

      - name: Run notebook
        run: |
          jupyter nbconvert --to notebook --execute notebook/2025summerstock-Copy6.ipynb --inplace

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated stock pipeline output update"
          git push
      
