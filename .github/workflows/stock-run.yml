name: Run Stock Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5" # 13:00 UTC weekdays

permissions:
  contents: write

concurrency:
  group: stock-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ROBINHOOD_USERNAME: ${{ secrets.ROBINHOOD_USERNAME }}
      ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
      PYTHONUNBUFFERED: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            robin-stocks \
            pandas \
            numpy \
            requests \
            matplotlib \
            openpyxl \
            python-dotenv \
            tqdm \
            jupyter \
            nbconvert \
            nbclient \
            ipykernel
          python -m ipykernel install --user --name python3

      - name: Restore legacy root database cache
        uses: actions/cache/restore@v4
        with:
          path: |
            *.db
          key: stock-dbs-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stock-dbs-${{ github.ref_name }}-

      - name: Restore generated databases
        uses: actions/cache/restore@v4
        with:
          path: |
            *.db
            data/*.db
            notebook/stockprediction2025/data/*.db
          key: stock-dbs-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stock-dbs-${{ github.ref_name }}-

      - name: Inspect restored pipeline state
        run: |
          python scripts/inspect_pipeline_state.py

      - name: Normalize restored databases
        run: |
          python scripts/promote_pipeline_databases.py

      - name: Inspect normalized pipeline state
        run: |
          python scripts/inspect_pipeline_state.py

      - name: Run notebook
        run: |
          python scripts/run_notebook_with_progress.py notebook/2025summerstock-Copy6.ipynb --kernel-name python3 --executed-output logs/executed-notebook.ipynb

      - name: Track shortlist performance
        run: |
          python scripts/track_shortlist_history.py
          {
            echo "## Latest shortlist"
            echo '```csv'
            cat analytics/winners_shortlist.csv
            echo '```'
            echo "## Forward-return evaluation"
            echo '```csv'
            cat analytics/shortlist_performance_summary.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export dashboard database
        run: |
          python scripts/export_dashboard_data.py

      - name: Inspect generated pipeline state
        if: always()
        run: |
          python scripts/inspect_pipeline_state.py

      - name: Validate generated outputs
        run: |
          python scripts/validate_pipeline_outputs.py

      - name: Save generated databases
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            *.db
            data/*.db
            notebook/stockprediction2025/data/*.db
          key: stock-dbs-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-outputs
          if-no-files-found: warn
          retention-days: 14
          path: |
            analytics/*.csv
            analytics/*.html
            vector_analysis_results.csv
            checkpoint_filtered.csv
            checkpoint_rejected.csv
            dashboard_data.db
            logs/executed-notebook.ipynb

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated stock pipeline output update"
          git push
