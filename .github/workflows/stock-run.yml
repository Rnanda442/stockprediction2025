name: Run Stock Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5" # 13:00 UTC weekdays

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      ROBINHOOD_USERNAME: ${{ secrets.ROBINHOOD_USERNAME }}
      ROBINHOOD_PASSWORD: ${{ secrets.ROBINHOOD_PASSWORD }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            robin-stocks \
            pandas \
            numpy \
            requests \
            matplotlib \
            openpyxl \
            python-dotenv \
            tqdm \
            jupyter \
            nbconvert \
            nbclient \
            ipykernel
          python -m ipykernel install --user --name python3

      - name: Run notebook
        run: |
          python scripts/run_notebook_with_progress.py notebook/2025summerstock-Copy6.ipynb --kernel-name python3

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated stock pipeline output update"
          git push
